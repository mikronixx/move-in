[tool.ruff]
line-length = 88
src = ["aws", "http_requests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.bandit]
exclude_dirs = ["tests", "requests_legacy"]
# B101: assert_used - expected in test code, safe to skip
skips = ["B101"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
python_version = "3.13"
mypy_path = "$MYPY_CONFIG_FILE_DIR"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["requests_mock"]
ignore_missing_imports = true
