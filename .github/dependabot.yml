version: 2
updates:
  - package-ecosystem: "pip"
    directories: ["/", "/useful_python/http_requests"] # finds requirements-*.txt in the repo root
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]           # one PR for all pip bumps, not one per package
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"                # scans .github/workflows/
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 7

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      hooks:
        patterns: ["*"]
    cooldown:
      default-days: 7
