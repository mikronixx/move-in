version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"                # finds requirements-*.txt in the repo root
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]           # one PR for all pip bumps, not one per package

  - package-ecosystem: "github-actions"
    directory: "/"                # scans .github/workflows/
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      hooks:
        patterns: ["*"]
