name: Links

on:
  pull_request:
    paths:
      - "**/*.md"
      - "lychee.toml"
      - ".github/workflows/links.yml"
  schedule:
    - cron: "17 14 * * 1"     # Mondays: catches links that rot while nothing changes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Restore the newest cache from this branch or the base branch.
      # The key is unique per run, so the save step below never collides with an existing key.
      - name: Restore lychee cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: lychee-

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Same lychee as the pre-commit hook (rev frozen at lychee-v0.24.2).
          lycheeVersion: v0.24.2
          # Options (timeout, retries, excludes, accepted codes) live in lychee.toml,
          # shared with the pre-commit hook. --root-dir resolves root-relative links like /docs/x.md.
          args: >-
            --config lychee.toml
            --root-dir "$(pwd)"
            --cache
            --max-cache-age 1d
            --no-progress
            './**/*.md'
          token: ${{ secrets.GITHUB_TOKEN }}   # avoids github.com rate limits
          fail: true
          failIfEmpty: true                    # a broken glob should fail, not pass silently
          jobSummary: true

      # Save even when links are broken (the usual failure), so the next run starts warm.
      - name: Save lychee cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ github.run_id }}-${{ github.run_attempt }}
