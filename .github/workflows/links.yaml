name: Links

on:
  pull_request:
    paths: ["**/*.md"]
  schedule:
    - cron: "17 14 * * 1"     # Mondays: catches links that rot while nothing changes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Cache pre-commit environments
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: 'pip install --only-binary :all: pre-commit==4.7.0'

      - name: Check links
        run: pre-commit run lychee --all-files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # lychee uses it to avoid github.com rate limits
