---
name: Python Security Scanner and Linter

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  pycheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: useful_python
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install tools
        run: pip install "ruff==0.16.8" "bandit==1.9.4"   

      - name: Run ruff
        run: ruff check . --output-format=github

      - name: Run bandit
        run: bandit -r -c pyproject.toml .