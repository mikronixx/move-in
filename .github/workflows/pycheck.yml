---

name: Python Security Scanner and Linter

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  pycheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: |
          pip install ruff

      - name: Install bandit
        run: |
          pip install bandit

      - name: Run ruff
        run: ruff check .
        working-directory: useful_python

      - name: Run bandit
        run: bandit -r -c pyproject.toml .
        working-directory: useful_python
