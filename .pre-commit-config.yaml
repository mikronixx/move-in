minimum_pre_commit_version: "4.4.0"
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: ef6cf06c079dd6b299dfc720b0f14400c9d168e1  # frozen: v0.17.5
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/PyCQA/bandit
    rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08  # frozen: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "useful_python/pyproject.toml"]
        files: ^useful_python/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: file-contents-sorter
        args: [--unique]
        files: ^(\.gitignore|dotfiles/gitignore_for_work)$
  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
    hooks:
      - id: codespell
        files: '\.md$'
        args: ["--ignore-words=.codespellignore"]
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229  # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck
  - repo: https://github.com/lycheeverse/lychee
    rev: 2bba271688c1abb1503097a064e6c3bc1d1b6a9b  # frozen: lychee-v0.24.2
    hooks:
      - id: lychee
        args: ["--no-progress"]
        files: \.md$
  - repo: https://github.com/mrtazz/checkmake
    rev: 59931d556f8f5cf4fbacf2c8390a8122ef7a881d  # frozen: v0.3.2
    hooks:
      - id: checkmake
  - repo: https://github.com/pypa/pip-audit
    rev: 8894eb8cee033531a1fbd9f2fb160892531c14e3  # frozen: v2.10.1
    hooks:
      - id: pip-audit
        name: pip-audit (tools + all)
        args: ["-r", "requirements-tools.txt", "-r", "requirements-all.txt"]
        files: ^requirements-(tools|all)\.txt$
      - id: pip-audit
        alias: pip-audit-http-requests
        name: pip-audit (http_requests lock)
        args:
          - "-r"
          - "useful_python/http_requests/requirements.txt"
          - "--require-hashes"
          - "--disable-pip"
        files: ^useful_python/http_requests/requirements\.txt$
      - id: pip-audit
        alias: pip-audit-pre-commit
        name: pip-audit (pre-commit lock)
        args:
          - "-r"
          - "requirements-pre-commit.txt"
          - "--require-hashes"
          - "--disable-pip"
        files: ^requirements-pre-commit\.txt$
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7  # frozen: v1.32.0
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      - id: pytest-http-requests
        name: pytest (http_requests)
        entry: bash -c 'cd useful_python/http_requests && python -m pytest -q'
        language: unsupported
        files: ^useful_python/http_requests/
        pass_filenames: false
      - id: mypy-http-requests
        name: mypy (http_requests)
        entry: bash -c 'cd useful_python/http_requests && python -m mypy --config-file=../pyproject.toml .'
        language: unsupported
        files: ^useful_python/(http_requests/|pyproject\.toml$)
        pass_filenames: false
